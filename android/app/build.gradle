plugins { id 'com.android.application' }

def sdlDir = file(providers.gradleProperty('sdlSourceDir').getOrElse('../../third_party/SDL3'))
if (!new File(sdlDir, 'CMakeLists.txt').isFile()) throw new GradleException('Set -PsdlSourceDir to the SDL3 source checkout')
def testKey = rootProject.file(providers.gradleProperty('testSigningKey').getOrElse('local/grpp-test.jks'))

// Release credentials stay outside source and packaged assets.
def privateSigningFile = file(providers.gradleProperty('androidSigningFile')
    .orElse(providers.environmentVariable('OPENMINOTAUR_SIGNING_FILE'))
    .getOrElse("${System.getProperty('user.home')}/AndroidSigning/openminotaur-signing.json"))
def privateSigning = null
if (privateSigningFile.isFile()) {
    try {
        privateSigning = new groovy.json.JsonSlurper().parseText(privateSigningFile.getText('UTF-8').replaceFirst('^\uFEFF', ''))
        if (!(privateSigning instanceof Map)) throw new IllegalArgumentException()
    } catch (Exception ignored) {
        throw new GradleException('Private release signing settings are not valid JSON')
    }
    if (!privateSigning.storeFile || !privateSigning.storePassword || !privateSigning.keyAlias ||
        !file(privateSigning.storeFile.toString()).isFile()) {
        throw new GradleException('Private release signing settings are incomplete or the keystore is unavailable')
    }
} else if (providers.gradleProperty('androidSigningFile').isPresent() || providers.environmentVariable('OPENMINOTAUR_SIGNING_FILE').isPresent()) {
    throw new GradleException('The requested private release signing settings file is unavailable')
}

android {
    namespace 'org.openminotaur.gridrunnerplusplus'
    compileSdk 35
    ndkVersion '27.2.12479018'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    defaultConfig {
        applicationId 'org.openminotaur.gridrunnerplusplus'
        minSdk 24
        targetSdk 35
        versionCode 44
        versionName '1.0'
        externalNativeBuild {
            cmake {
                arguments '-DBUILD_TESTING=OFF', '-DANDROID_STL=c++_static',
                    '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON', '-DCMAKE_OBJECT_PATH_MAX=180',
                    "-DSDL3_SOURCE_DIR=${sdlDir.absolutePath.replace('\\','/')}"
                targets 'grpp_app'
                abiFilters.addAll(providers.gradleProperty('targetAbis').getOrElse('arm64-v8a,armeabi-v7a').tokenize(','))
            }
        }
    }
    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
            if (providers.gradleProperty('nativeBuildDir').isPresent()) buildStagingDirectory file(providers.gradleProperty('nativeBuildDir').get())
        }
    }
    sourceSets.main {
        java.srcDirs += "${sdlDir}/android-project/app/src/main/java"
        assets.srcDirs = [layout.buildDirectory.dir('generated/assets').get().asFile]
    }
    signingConfigs {
        if (privateSigning != null) {
            releaseKey {
                storeFile file(privateSigning.storeFile.toString())
                storePassword privateSigning.storePassword.toString()
                keyAlias privateSigning.keyAlias.toString()
                keyPassword (privateSigning.keyPassword ?: privateSigning.storePassword).toString()
                storeType (privateSigning.storeType ?: 'PKCS12').toString()
            }
        }
        testing {
            storeFile testKey
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig (privateSigning != null ? signingConfigs.releaseKey : signingConfigs.testing) }
    }
}

android.sourceSets.main.res.srcDir(layout.buildDirectory.dir('generated/icon-res'))
tasks.register('prepareAppIcon', Sync) {
    from('../../resources/app-icon.png')
    rename { 'icon.png' }
    into layout.buildDirectory.dir('generated/icon-res/drawable-nodpi')
}

tasks.register('bundleGameAssets', Zip) {
    from('../../assets')
    archiveFileName = 'grpp-assets.zip'
    destinationDirectory = layout.buildDirectory.dir('generated/assets')
    reproducibleFileOrder = true
    preserveFileTimestamps = false
}
tasks.register('bundleLicense', Sync) {
    from('../../LICENSE.txt')
    from('../../THIRD-PARTY-NOTICES.txt')
    from('../../LICENSES') { into 'LICENSES' }
    into layout.buildDirectory.dir('generated/assets/licenses')
}
tasks.named('preBuild').configure { dependsOn 'bundleGameAssets', 'bundleLicense', 'prepareAppIcon' }
